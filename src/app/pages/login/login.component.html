<div class="login-page">

  <!-- Background decorations -->
  <div class="login-bg-orb login-bg-orb--1"></div>
  <div class="login-bg-orb login-bg-orb--2"></div>
  <div class="login-bg-orb login-bg-orb--3"></div>

  <div class="login-card">

    <!-- Logo / Brand -->
    <div class="login-brand">
      <div class="login-logo">
        <mat-icon>hub</mat-icon>
      </div>
      <h1 class="login-app-name">SNR Tools</h1>
      <p class="login-tagline">Family data, synced everywhere</p>
    </div>

    <!-- Tab Toggle -->
    <div class="login-tabs">
      <button class="login-tab" [class.active]="mode === 'login'" (click)="mode = 'login'; errorMessage = ''; successMessage = ''">
        Sign In
      </button>
      <button class="login-tab" [class.active]="mode === 'signup'" (click)="mode = 'signup'; errorMessage = ''; successMessage = ''">
        Create Account
      </button>
    </div>

    <!-- Form -->
    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>

      <!-- Email -->
      <div class="login-field">
        <label class="login-label" for="login-email">Email address</label>
        <div class="login-input-wrap">
          <mat-icon class="login-input-icon">email</mat-icon>
          <input
            id="login-email"
            type="email"
            class="login-input"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="login-field">
        <label class="login-label" for="login-password">Password</label>
        <div class="login-input-wrap">
          <mat-icon class="login-input-icon">lock</mat-icon>
          <input
            id="login-password"
            [type]="showPassword ? 'text' : 'password'"
            class="login-input"
            [(ngModel)]="password"
            name="password"
            placeholder="At least 6 characters"
            autocomplete="current-password"
            required
          />
          <button type="button" class="login-eye-btn" (click)="showPassword = !showPassword" tabindex="-1">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <!-- Confirm Password (signup only) -->
      <div class="login-field" *ngIf="mode === 'signup'">
        <label class="login-label" for="login-confirm">Confirm Password</label>
        <div class="login-input-wrap">
          <mat-icon class="login-input-icon">lock_outline</mat-icon>
          <input
            id="login-confirm"
            [type]="showPassword ? 'text' : 'password'"
            class="login-input"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Repeat your password"
            autocomplete="new-password"
          />
        </div>
      </div>

      <!-- Error / Success messages -->
      <div class="login-alert login-alert--error" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        {{ errorMessage }}
      </div>
      <div class="login-alert login-alert--success" *ngIf="successMessage">
        <mat-icon>check_circle_outline</mat-icon>
        {{ successMessage }}
      </div>

      <!-- Submit -->
      <button
        id="login-submit-btn"
        type="submit"
        class="login-btn login-btn--primary"
        [disabled]="loading"
      >
        <span *ngIf="!loading">{{ mode === 'login' ? 'Sign In' : 'Create Account' }}</span>
        <span *ngIf="loading" class="login-spinner"></span>
      </button>

    </form>

    <!-- Divider -->
    <div class="login-divider">
      <span>or continue with</span>
    </div>

    <!-- Google OAuth -->
    <button
      id="login-google-btn"
      type="button"
      class="login-btn login-btn--google"
      (click)="signInWithGoogle()"
      [disabled]="loading"
    >
      <!-- Google "G" SVG logo -->
      <svg class="login-google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.1 0 5.6 1.1 7.5 2.9l5.6-5.6C33.4 3.5 29 1.5 24 1.5 14.9 1.5 7.2 7.1 4 15l6.6 5.1C12.3 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7C43.5 36.8 46.5 30.9 46.5 24z"/>
        <path fill="#FBBC05" d="M10.6 28.9A14.5 14.5 0 0 1 9.5 24c0-1.7.3-3.4.9-5L3.8 14c-1.5 3-2.3 6.3-2.3 10s.8 7 2.3 10l6.8-5.1z"/>
        <path fill="#34A853" d="M24 46.5c5 0 9.2-1.6 12.3-4.4l-7.4-5.7c-1.7 1.1-3.8 1.8-4.9 1.8-6.3 0-11.7-4.2-13.6-10l-6.6 5.1C7.2 40.9 14.9 46.5 24 46.5z"/>
        <path fill="none" d="M1.5 1.5h45v45h-45z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Footer note -->
    <p class="login-footer-note">
      Your data is protected with Row-Level Security. Only you and invited family members can access it.
    </p>

  </div>
</div>
