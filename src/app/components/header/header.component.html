<header class="snr-header">
  <!-- Left: menu toggle + breadcrumb -->
  <div class="snr-header-left">
    <button class="snr-icon-btn" (click)="sidenav.toggle()" title="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="snr-header-brand">
      <span class="snr-header-logo"><mat-icon>hub</mat-icon></span>
      <span class="snr-header-title">SNR Tools</span>
    </div>
  </div>

  <!-- Right: theme + settings + avatar -->
  <div class="snr-header-right">

    <!-- Theme picker -->
    <div class="snr-header-dropdown" (click)="$event.stopPropagation()">
      <button class="snr-icon-btn" (click)="toggleThemeMenu()" title="Change Theme">
        <mat-icon>palette</mat-icon>
      </button>
      <div class="snr-dropdown-panel" [class.open]="themeMenuOpen">
        <div class="snr-dropdown-header">
          <mat-icon>palette</mat-icon> Choose Theme
        </div>
        <div class="snr-dropdown-list">
          <button class="snr-dropdown-item" *ngFor="let theme of themes; let i = index"
                  [class.active]="currentTheme === i"
                  (click)="changeTheme(i)">
            <span class="snr-theme-swatch" [style.background]="theme.primary"></span>
            {{ theme.name }}
            <mat-icon *ngIf="currentTheme === i" class="snr-check">check</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="snr-header-divider"></div>

    <button class="snr-icon-btn" title="Settings">
      <mat-icon>settings</mat-icon>
    </button>

    <!-- Avatar -->
    <div class="snr-avatar" title="Profile">
      <mat-icon>person</mat-icon>
    </div>
  </div>
</header>
